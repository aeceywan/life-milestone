


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Milestone</title>
<style>
:root{
  --bg:#f5f5f7;--surface:rgba(255,255,255,.78);--paper:rgba(255,255,255,.9);--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --done:#eef7f1;--future:#ffffff;--manual:#fff8e7;--social:#fff2bf;--flex:#edf4ff;--formal:#f5efff;
  --accent:#007aff;--green:#34c759;--blue:#0a84ff;--purple:#af52de;--orange:#ff9f0a;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:radial-gradient(circle at 18% 10%,rgba(10,132,255,.12),transparent 28%),radial-gradient(circle at 82% 6%,rgba(175,82,222,.1),transparent 25%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);min-height:100vh}
.loginScreen{min-height:calc(100vh - 48px);display:grid;place-items:center}
.loginPanel{width:min(420px,100%);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.78);border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.12);backdrop-filter:blur(24px);padding:34px}
.loginAvatar{width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#eaf3ff,#fff);display:grid;place-items:center;color:var(--accent);font-size:30px;font-weight:800;margin:0 auto 18px;box-shadow:inset 0 0 0 1px rgba(0,122,255,.12)}
.loginPanel h1{text-align:center;font-size:30px;margin:0}.loginText{text-align:center;margin:8px 0 24px;color:var(--muted);font-size:14px;line-height:1.6}
.loginField{display:block;margin-bottom:14px}.loginField span{display:block;color:var(--muted);font-size:12px;margin:0 0 6px 2px}.loginField input{width:100%;height:46px;border:1px solid rgba(60,60,67,.18);border-radius:12px;background:rgba(255,255,255,.86);font:17px/1 inherit;color:var(--ink);outline:none;padding:0 13px}.loginField input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,122,255,.14)}
.loginSubmit{width:100%;height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 10px 28px rgba(0,122,255,.24)}.loginSubmit:hover{background:#0071eb}.loginError{min-height:18px;margin:10px 0 0;color:#ff3b30;text-align:center;font-size:13px}
.syncStatus{margin-left:auto;color:var(--muted);font-size:12px}
.appShell{display:none}.unlocked .appShell{display:block}.unlocked .loginScreen{display:none}
.wrap{max-width:1320px;margin:0 auto}
.toolbar{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:34px;font-weight:760;letter-spacing:0}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid rgba(60,60,67,.14);background:rgba(255,255,255,.72);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.04);backdrop-filter:blur(16px)}button:hover{background:rgba(255,255,255,.95)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--surface);border:1px solid rgba(255,255,255,.82);border-radius:8px;padding:15px 16px;box-shadow:0 10px 30px rgba(0,0,0,.05);backdrop-filter:blur(18px)}.card span{font-size:13px;color:var(--muted)}.card b{display:block;font-size:23px;margin-top:7px;line-height:1.2;letter-spacing:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:13px}.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.68);border:1px solid rgba(60,60,67,.12);border-radius:999px;padding:7px 10px;backdrop-filter:blur(18px)}.dot{width:11px;height:11px;border-radius:999px;border:1px solid rgba(0,0,0,.08)}
.paper{background:var(--paper);border:1px solid rgba(60,60,67,.14);box-shadow:0 18px 60px rgba(0,0,0,.08);padding:12px;overflow:auto;border-radius:14px;backdrop-filter:blur(20px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px;table-layout:fixed}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}thead th{position:sticky;top:0;z-index:2;background:rgba(245,245,247,.92);height:42px;font-size:13px;font-weight:650;border-top:1px solid var(--line);backdrop-filter:blur(18px)}th:first-child,td:first-child{border-left:1px solid var(--line)}
.year{width:68px;text-align:center;font-weight:760;background:#fbfbfd}.age{width:58px;text-align:center;background:#fbfbfd;font-size:13px;color:var(--muted)}
.month{width:74px;text-align:center}.cell{height:78px;vertical-align:top;background:var(--future);cursor:pointer;position:relative;padding:6px 5px;transition:background .18s ease,box-shadow .18s ease}.cell:hover{box-shadow:inset 0 0 0 2px rgba(0,122,255,.18)}.cell.done{background:var(--done)}.cell.manual{box-shadow:inset 0 0 0 2px rgba(255,159,10,.24)}.cell.social{background:var(--social)!important}.cell.flex{background:var(--flex)!important}.cell.formal{background:var(--formal)!important}.cell.today{outline:3px solid rgba(0,122,255,.22);outline-offset:-4px}
.monthNo{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.check{border:0;background:transparent;box-shadow:none;border-radius:8px;color:#248a3d;font-size:16px;font-weight:800;line-height:1;padding:0 2px;min-width:18px}.check:hover{background:rgba(255,255,255,.72)}
.events{display:flex;flex-direction:column;gap:4px;margin-top:5px}.eventItem{display:flex;align-items:flex-start;gap:5px;min-width:0;color:#1d1d1f;font-size:10px;font-weight:650;line-height:1.18}.eventItem .eventText{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.eventDot{width:8px;height:8px;border-radius:999px;flex:0 0 8px;margin-top:2px;border:1px solid rgba(0,0,0,.08)}
.eventItem.social{color:#8a5b00}.eventItem.flex{color:var(--blue)}.eventItem.formal{color:var(--purple)}
.editor{position:fixed;z-index:10;width:min(360px,calc(100vw - 24px));background:rgba(255,255,255,.88);border:1px solid rgba(60,60,67,.16);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.18);padding:14px;display:none;backdrop-filter:blur(24px)}.editor.open{display:block}.editorTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:760}.editorClose{border:0;background:transparent;box-shadow:none;border-radius:10px;font-size:20px;line-height:1;padding:2px 6px}.eventRow{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}.eventRow textarea{width:100%;min-height:52px;resize:vertical;border:1px solid rgba(60,60,67,.18);border-radius:12px;background:rgba(255,255,255,.9);padding:8px 9px;font:14px/1.45 inherit;color:var(--ink);outline:none}.eventRow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,122,255,.12)}.editorHint{font-size:12px;color:var(--muted);line-height:1.5}
.hint{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:760px){body{padding:12px}h1{font-size:24px}.stats{grid-template-columns:1fr}.paper{padding:10px}button{padding:9px 12px}.editor{left:12px!important;right:12px!important;top:82px!important;width:auto}}
@media print{body{background:#fff;padding:0}.toolbar,.stats,.legend,.hint,.editor{display:none}.paper{box-shadow:none;border:1px solid #000;padding:6px;border-radius:0}table{min-width:0}th{height:28px}.cell{height:52px;padding:3px}.month{width:52px}.eventItem{font-size:8px}}
</style>
</head>
<body>
<section class="loginScreen" id="loginScreen">
  <form class="loginPanel" id="loginForm" autocomplete="off">
    <div class="loginAvatar">A</div>
    <h1>My Milestone</h1>
    <p class="loginText">输入密码后进入你的 milestone 页面。</p>
    <label class="loginField">
      <span>用户名</span>
      <input id="loginUser" name="username" value="Alisa" readonly />
    </label>
    <label class="loginField">
      <span>密码</span>
      <input id="loginPass" name="password" type="password" autofocus inputmode="text" />
    </label>
    <button class="loginSubmit" type="submit">进入</button>
    <div class="loginError" id="loginError" aria-live="polite"></div>
  </form>
</section>
<div class="appShell" id="appShell">
<div class="wrap">
  <div class="toolbar">
    <div>
      <h1>My Milestone</h1>
      <div class="subtitle" id="subtitle">出生：1985年9月18日｜显示到55岁</div>
    </div>
    <div class="actions">
      <button id="autoFill">恢复自动勾选</button>
      <button onclick="window.print()">打印 / 存为PDF</button>
    </div>
  </div>
  <div class="stats">
    <div class="card"><span>距离弹性退休</span><b id="daysToFlex">计算中</b></div>
    <div class="card"><span>社保满20年</span><b>2029年11月</b></div>
    <div class="card"><span>正式退休年龄</span><b>2040年9月</b></div>
  </div>
  <div class="legend">
    <span class="tag"><i class="dot" style="background:var(--done)"></i>已过 / 已勾选</span>
    <span class="tag"><i class="dot" style="background:var(--social)"></i>社保满20年</span>
    <span class="tag"><i class="dot" style="background:var(--flex)"></i>52岁弹性退休资格</span>
    <span class="tag"><i class="dot" style="background:var(--formal)"></i>55岁正式退休年龄</span>
    <span class="tag">点击月份记录事件；点击对勾切换状态</span>
    <span class="syncStatus" id="syncStatus">未同步</span>
  </div>
  <div class="paper"><table id="grid"><thead><tr><th class="year">年份</th><th class="age">年龄</th><th class="month">1月</th><th class="month">2月</th><th class="month">3月</th><th class="month">4月</th><th class="month">5月</th><th class="month">6月</th><th class="month">7月</th><th class="month">8月</th><th class="month">9月</th><th class="month">10月</th><th class="month">11月</th><th class="month">12月</th></tr></thead><tbody></tbody></table></div>
  <div class="hint">说明：内容会保存在当前浏览器本地。关键节点月份已作为默认大事件放入表格；你可以在任意月份记录旅行、家人纪念日、项目节点、健康变化或任何真正属于你的人生事件。</div>
</div>
</div>
<div class="editor" id="editor" aria-hidden="true"></div>
<script>
const CONFIG={birth:{y:1985,m:9,d:18},workStart:{y:2009,m:7,d:13},socialStart:{y:2009,m:12},endYear:2040,flex:{y:2037,m:9,d:18},formal:{y:2040,m:9,d:18},storageKey:"alisa_life_milestone_v1"};
const SUPABASE_CONFIG={url:"https://aftsxpjmmaszaxousucj.supabase.co",key:"sb_publishable_h4srjdcNSUd28DCMUBWHpg_-grYOczh"};
const AUTH_USER={username:"Alisa",email:"alisa@life-milestone.local"};
const COLORS=['#d97745','#4d8b57','#4c73b8','#7a5ab8','#c05f8f','#5f8f89','#b88734'];
let currentUser=null;
let accessToken=null;
function key(y,m){return `${y}-${String(m).padStart(2,"0")}`}
function mi(y,m){return y*12+m}
function load(){try{return JSON.parse(localStorage.getItem(CONFIG.storageKey)||'{"checks":{},"notes":{}}')}catch(e){return {checks:{},notes:{}}}}
function save(s){localStorage.setItem(CONFIG.storageKey,JSON.stringify(s))}
function setSyncStatus(text){const el=document.getElementById('syncStatus'); if(el)el.textContent=text}
function ageAtYear(y){return y-CONFIG.birth.y}
function currentAutoEnd(today=new Date()){return {y:today.getFullYear(),m:today.getMonth()+1}}
function currentMonthKey(today=new Date()){return key(today.getFullYear(),today.getMonth()+1)}
function autoChecked(y,m){const end=currentAutoEnd(); return mi(y,m)>=mi(CONFIG.socialStart.y,CONFIG.socialStart.m)&&mi(y,m)<=mi(end.y,end.m)}
function parseKey(k){const [y,m]=k.split('-').map(Number); return {y,m}}
function monthDate(k){return `${k}-01`}
function keyFromDate(date){return date.slice(0,7)}
function monthEvent(y,m){
 if(y===2029&&m===11)return {cls:'social',txt:'社保缴纳满20年'};
 if(y===2037&&m===9)return {cls:'flex',txt:'52岁弹性退休资格'};
 if(y===2040&&m===9)return {cls:'formal',txt:'55岁正式退休'};
 return null;
}
function customEvents(s,k){
 const value=s.notes&&s.notes[k];
 if(Array.isArray(value))return value.map(v=>String(v).trim()).filter(Boolean);
 if(typeof value==='string'&&value.trim())return [value.trim()];
 return [];
}
function eventHTML(events){
 if(!events.length)return '';
 return `<div class="events">${events.map((ev,i)=>{
  const cls=ev.cls||''; const color=ev.color||COLORS[i%COLORS.length];
  return `<div class="eventItem ${cls}"><span class="eventDot" style="background:${color}"></span><span class="eventText">${escapeHTML(ev.txt)}</span></div>`;
 }).join('')}</div>`;
}
function escapeHTML(text){
 return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function workTenureText(today=new Date()){
 const years=today.getFullYear()-CONFIG.workStart.y;
 let months=today.getMonth()+1-CONFIG.workStart.m;
 let fullYears=years;
 if(today.getDate()<CONFIG.workStart.d)months-=1;
 if(months<0){fullYears-=1;months+=12}
 return `${Math.max(0,fullYears)}年${Math.max(0,months)}个月`;
}
function render(useAuto=false){
 const s=useAuto?{checks:{},notes:load().notes}:load(); const tbody=document.querySelector('#grid tbody'); tbody.innerHTML=''; const now=new Date();
 for(let y=CONFIG.workStart.y;y<=CONFIG.endYear;y++){
  const tr=document.createElement('tr'); tr.insertAdjacentHTML('beforeend',`<td class="year">${y}</td><td class="age">${ageAtYear(y)}岁</td>`);
  for(let m=1;m<=12;m++){
   const k=key(y,m), ev=monthEvent(y,m), checked=s.checks[k]!==undefined?s.checks[k]:autoChecked(y,m), userEvents=customEvents(s,k); const td=document.createElement('td');
   td.className='cell '+(checked?'done ':'')+(s.checks[k]!==undefined?'manual ':'')+(ev?ev.cls+' ':'')+(y===now.getFullYear()&&m===now.getMonth()+1?'today':'');
   td.dataset.key=k; td.dataset.checked=checked?'1':'0';
   const events=[...(ev?[ev]:[]),...userEvents.map((txt,i)=>({txt,color:COLORS[i%COLORS.length]}))];
   td.innerHTML=`<div class="monthNo"><span>${m}月</span><button class="check" type="button" aria-label="切换${k}状态">${checked?'✓':''}</button></div>${eventHTML(events)}`;
   td.addEventListener('click',e=>{if(e.target.classList.contains('check')){const st=load(); st.checks[k]=!(td.dataset.checked==='1'); save(st); syncMonth(k,st); render(false); return} openEditor(td,y,m)});
   tr.appendChild(td);
  }
  tbody.appendChild(tr);
 }
}
function openEditor(cell,y,m){
 const k=key(y,m), s=load(), values=[...customEvents(s,k),''], editor=document.getElementById('editor');
 editor.dataset.key=k; editor.innerHTML=`<div class="editorTitle"><span>${y}年${m}月</span><button class="editorClose" type="button" aria-label="关闭">×</button></div><div class="editorRows">${values.map((v,i)=>rowHTML(v,i)).join('')}</div><div class="editorHint">写下这一月的大事；填完最后一条后会自动出现新的空白。</div>`;
 const rect=cell.getBoundingClientRect(), left=Math.min(rect.left,window.innerWidth-372), top=Math.min(rect.bottom+8,window.innerHeight-260);
 editor.style.left=Math.max(12,left)+'px'; editor.style.top=Math.max(12,top)+'px'; editor.classList.add('open'); editor.setAttribute('aria-hidden','false');
 editor.querySelector('textarea').focus();
}
function rowHTML(value,i){
 return `<div class="eventRow"><span class="eventDot" style="background:${COLORS[i%COLORS.length]}"></span><textarea data-index="${i}" placeholder="这一月发生了什么？">${escapeHTML(value)}</textarea></div>`;
}
function saveEditor(sync=false){
 const editor=document.getElementById('editor'), k=editor.dataset.key; if(!k)return;
 const st=load(), values=[...editor.querySelectorAll('textarea')].map(t=>t.value.trim()).filter(Boolean);
 if(!st.notes)st.notes={};
 if(values.length)st.notes[k]=values; else delete st.notes[k];
 save(st);
 if(sync)syncMonth(k,st);
}
function closeEditor(){const editor=document.getElementById('editor'); editor.classList.remove('open'); editor.setAttribute('aria-hidden','true'); editor.dataset.key=''}
async function unlock(){
 document.body.classList.add('unlocked');
 document.getElementById('loginPass').value='';
 updateStats();
 render(false);
 await loadRemoteMilestones();
 await ensureCurrentMonthAutoChecked();
 render(false);
}
function setupLogin(){
 const form=document.getElementById('loginForm'), pass=document.getElementById('loginPass'), error=document.getElementById('loginError');
 document.getElementById('loginUser').value=AUTH_USER.username;
 pass.focus();
 pass.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); form.requestSubmit()}
 });
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  error.textContent='';
  if(document.getElementById('loginUser').value!==AUTH_USER.username){error.textContent='用户名不可用。'; return}
  try{
   const data=await signInWithPassword(pass.value);
   accessToken=data.access_token;
   currentUser=data.user;
   await unlock();
   return;
  }catch(authError){
   error.textContent='登录失败，请检查密码。';
  }
  pass.value='';
  pass.focus();
 });
}
async function supabaseRequest(path,options={}){
 const headers={
  apikey:SUPABASE_CONFIG.key,
  'Content-Type':'application/json',
  ...(accessToken?{Authorization:`Bearer ${accessToken}`}:{})
 };
 const res=await fetch(`${SUPABASE_CONFIG.url}${path}`,{
  ...options,
  headers:{...headers,...(options.headers||{})}
 });
 if(!res.ok)throw new Error(await res.text());
 if(res.status===204)return null;
 const text=await res.text();
 return text?JSON.parse(text):null;
}
function signInWithPassword(password){
 return supabaseRequest('/auth/v1/token?grant_type=password',{
  method:'POST',
  body:JSON.stringify({email:AUTH_USER.email,password})
 });
}
async function loadRemoteMilestones(){
 if(!accessToken||!currentUser){setSyncStatus('离线模式'); return}
 setSyncStatus('同步中...');
 let data=[];
 try{
  data=await supabaseRequest(`/rest/v1/milestones?select=milestone_month,is_checked,events&user_id=eq.${currentUser.id}`);
 }catch(error){
  setSyncStatus('云端读取失败，已使用本地数据');
  return;
 }
 const st=load();
 if(!st.checks)st.checks={};
 if(!st.notes)st.notes={};
 data.forEach(row=>{
  const k=keyFromDate(row.milestone_month);
  st.checks[k]=!!row.is_checked;
  if(Array.isArray(row.events)&&row.events.length)st.notes[k]=row.events.map(v=>String(v)).filter(Boolean);
  else delete st.notes[k];
 });
 save(st);
 setSyncStatus('已同步');
}
async function syncMonth(k,st=load()){
 if(!accessToken||!currentUser){setSyncStatus('已保存到本地'); return}
 const {y,m}=parseKey(k), isChecked=st.checks&&st.checks[k]!==undefined?st.checks[k]:autoChecked(y,m), events=customEvents(st,k);
 setSyncStatus('同步中...');
 try{
  await supabaseRequest('/rest/v1/milestones?on_conflict=user_id,milestone_month',{
   method:'POST',
   headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
   body:JSON.stringify({
    user_id:currentUser.id,
    milestone_month:monthDate(k),
    is_checked:!!isChecked,
    events
   })
  });
  setSyncStatus('已同步');
 }catch(error){
  setSyncStatus('云端同步失败，已保存到本地');
 }
}
async function ensureCurrentMonthAutoChecked(){
 const k=currentMonthKey();
 const {y,m}=parseKey(k);
 if(!autoChecked(y,m))return;
 const st=load();
 if(!st.checks)st.checks={};
 // 如果用户手动取消过当月，不覆盖；只在没有手动记录时自动补勾。
 if(st.checks[k]!==undefined)return;
 st.checks[k]=true;
 save(st);
 await syncMonth(k,st);
}
function updateStats(){
 const today=new Date(); today.setHours(0,0,0,0); const work=new Date(CONFIG.workStart.y,CONFIG.workStart.m-1,CONFIG.workStart.d); const flex=new Date(CONFIG.flex.y,CONFIG.flex.m-1,CONFIG.flex.d); const day=86400000;
 const autoEnd=currentAutoEnd(today);
 document.getElementById('subtitle').textContent=`出生：1985年9月18日｜当前工龄：${workTenureText(today)}｜社保推算起始：2009年12月｜已自动勾选至：${autoEnd.y}年${autoEnd.m}月｜显示到55岁`;
 document.getElementById('daysToFlex').textContent=Math.max(0,Math.ceil((flex-today)/day)).toLocaleString('zh-CN')+'天';
}
document.getElementById('autoFill').onclick=async()=>{const st=load(); st.checks={}; save(st); render(true); await ensureCurrentMonthAutoChecked(); render(false); setSyncStatus(accessToken?'已恢复自动勾选并同步':'已保存到本地')};
document.getElementById('editor').addEventListener('input',e=>{
 if(e.target.tagName!=='TEXTAREA')return;
 const rows=e.currentTarget.querySelector('.editorRows'), textareas=[...rows.querySelectorAll('textarea')];
 if(textareas[textareas.length-1].value.trim())rows.insertAdjacentHTML('beforeend',rowHTML('',textareas.length));
 saveEditor(false);
});
document.getElementById('editor').addEventListener('click',e=>{if(e.target.classList.contains('editorClose')){saveEditor(true); closeEditor(); render(false)}});
document.addEventListener('click',e=>{const editor=document.getElementById('editor'); if(!editor.classList.contains('open'))return; if(editor.contains(e.target)||e.target.closest('.cell'))return; saveEditor(true); closeEditor(); render(false)});
setupLogin();
</script>
</body>
</html>
